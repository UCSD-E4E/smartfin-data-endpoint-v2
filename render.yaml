services:
  - type: web
    name: smartfin-data-endpoint-v2
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && gunicorn smartfin_server.wsgi:application --bind 0.0.0.0:$PORT --workers 3
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: smartfin-data-endpoint-v2.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://smartfin-data-endpoint-v2.onrender.com
      - key: DB_SSL_REQUIRE
        value: "True"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smartfin-db
          property: connectionString

databases:
  - name: smartfin-db
